version: '3.8'

services:
  evolution_api:
    image: atendai/evolution-api:v2.2.0
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://wa.postora.cloud
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_CREDENTIALS=true

      # Auth Key
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=postora_evolution_secret_2026

      # Database Configuration (Connects to internal Postgres below)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:evolution_secret_pass_2026@evolution_postgres:5432/evolution_db?schema=public
      - DATABASE_CLIENT_NAME=evolution_exchange

      # Redis Cache Configuration (Connects to internal Redis below)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_TTL=604800
      - CACHE_REDIS_SAVE_INSTANCES=true

      # Logging & Behavior
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
    depends_on:
      evolution_postgres:
        condition: service_started
      evolution_redis:
        condition: service_started
    networks:
      - evolution_internal_net
      - dokploy-network

  evolution_postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=evolution_secret_pass_2026
      - POSTGRES_DB=evolution_db
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_internal_net

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution_internal_net

volumes:
  evolution_postgres_data:
  evolution_redis_data:

networks:
  evolution_internal_net:
    driver: bridge
  dokploy-network:
    external: true
